<!-- الخزنة -->
<section id="tab-cash" hidden>
  <!-- v185: الرصيد كبير وتحته الشهر ده بس — «داخل/خارج من أول يوم» ما بيفيدش في الشغل اليومي -->
  <div class="pt-head cash-head"><div><h2>الخزنة · فيها دلوقتي</h2><div id="cash-stats"></div></div>

  <!-- أكتر ٣ حركات بتتعمل في الخزنة — دوسة واحدة -->
  <div class="cq" id="cash-quick">
    <button class="tbtn primary" type="button" data-cashq="expense"><span class="ic" aria-hidden="true"><svg class="i"><use href="#i-receipt"/></svg></span>مصروف</button>
    <button class="tbtn" type="button" data-cashq="out"><span class="ic" aria-hidden="true"><svg class="i"><use href="#i-factory"/></svg></span>دفع لمورد</button>
    <button class="tbtn" type="button" data-cashq="settle"><span class="ic" aria-hidden="true"><svg class="i"><use href="#i-truck"/></svg></span>استلام من شركة شحن</button>
    <button class="tbtn" type="button" data-openentry="cash">+ حركة تانية</button>
  </div></div>

  <div class="toolbar">
    <div class="s-search">
      <input id="cf-text" type="search" placeholder="جهة، بيان، رقم أوردر…" autocomplete="off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
      </svg>
    </div>
    <button class="tbtn" type="button" id="b-cfilters" aria-expanded="false" aria-controls="cash-filters">
      فلاتر <span class="fcount" id="cf-count" hidden>0</span>
    </button>
    <button class="tbtn" type="button" id="b-cash-img">نزّل صورة للموبايل</button>
  </div>

  <div class="filters" id="cash-filters" hidden>
    <div><label for="cf-dir">الاتجاه</label>
      <select id="cf-dir">
        <option value="">الكل</option>
        <option value="in">داخل بس</option>
        <option value="out">خارج بس</option>
      </select></div>
    <div><label for="cf-kind">نوع الحركة</label>
      <select id="cf-kind">
        <option value="">الكل</option>
        <option value="تحصيل">تحصيل من عملاء</option>
        <option value="دفع">دفع لموردين</option>
        <option value="مصروف">مصاريف</option>
        <option value="شحن">شحن</option>
        <option value="رأس مال">رأس مال وشركاء</option>
        <option value="افتتاحي">أرصدة افتتاحية</option>
      </select></div>
    <div><label for="cf-src">مصدر الحركة</label>
      <select id="cf-src">
        <option value="">الكل</option>
        <option value="يدوي">يدوي (اللي سجّلته بإيدك)</option>
        <option value="تلقائي">تلقائي (من أوردر أو شراء)</option>
      </select></div>
    <div><label for="cf-from">من تاريخ</label><input type="date" id="cf-from"></div>
    <div><label for="cf-to">لتاريخ</label><input type="date" id="cf-to"></div>
  </div>

  <div class="chips" id="cf-chips"></div>
  <div class="quick cash-kinds" id="cash-kinds" role="group" aria-label="نوع الحركة"></div>

  <div class="panel" id="entry-cash" hidden>
    <div class="dhead">
      <h3 id="title-cash">حركة نقدية</h3>
      <button class="dclose" type="button" data-closeentry aria-label="قفل">&times;</button>
    </div>
    <div class="dbody">
    <p class="impact" id="impact-cash" hidden></p>
    <form class="grid" id="f-cash">
      <div><label for="c-date">التاريخ</label><input type="date" id="c-date" required></div>
      <div><label for="c-type">النوع</label>
        <select id="c-type">
          <option value="in">تحصيل من عميل</option>
          <option value="out">دفع لمورد</option>
          <option value="expense">مصروف</option>
          <option value="settle">سحب من شركة شحن</option>
        </select>
      </div>
      <div class="cash-ship" hidden><label for="c-shipco">شركة الشحن</label>
        <select id="c-shipco"></select></div>
      <div><label for="c-party">الجهة</label><select id="c-party"></select></div>
      <div><label for="c-amount">المبلغ</label><input type="number" id="c-amount" step="any" min="0" required></div>
      <div><label for="c-note">البيان</label><input id="c-note" autocomplete="off"></div>
      <div class="cash-kind" hidden style="grid-column:1/-1"><label id="c-cat-l">نوع المصروف</label>
        <div class="quick c-cats" id="c-cats" role="group" aria-labelledby="c-cat-l">
          <button type="button" data-ccat="metatop">شحن رصيد فيسبوك</button>
          <button type="button" data-ccat="ads">إعلانات</button>
          <button type="button" data-ccat="pack">تغليف</button>
          <button type="button" data-ccat="trans">انتقالات شراء بضاعة</button>
          <button type="button" data-ccat="subs">اشتراكات</button>
          <button type="button" data-ccat="salary">مرتبات</button>
          <button type="button" data-ccat="once">مرة واحدة (معدات · فلايرات · تفاعل)</button>
          <button type="button" data-ccat="other">تاني</button>
        </div>
        <input type="hidden" id="c-cat">
        <p class="hintline" id="c-cat-hint" style="margin:6px 0 0"></p>
        <div class="c-xtra">
          <div id="c-meta-wrap" hidden><label for="c-credit">دخل رصيد فيسبوك كام؟</label><input type="number" id="c-credit" step="any" min="0" autocomplete="off">
            <p class="hintline" id="c-credit-hint"></p></div>
          <div id="c-svc-wrap" hidden><label for="c-svc">بيتحسب على</label><select id="c-svc"><option value='1'>يوم الدفع</option><option value='7'>أسبوع</option><option value='30'>شهر</option><option value='90'>٣ شهور</option><option value='365'>سنة</option></select>
            <p class="hintline" id="c-svc-hint"></p></div>
          <div id="c-payer-wrap" hidden><label for="c-paidby">دفعه مين؟</label><select id="c-paidby"></select>
            <p class="hintline" id="c-payer-hint"></p></div>
        </div>
        <div class="c-src" id="c-src-wrap" hidden>
          <div><label for="c-src">الإعلان على</label><select id="c-src"></select></div>
          <div><label for="c-camp">الحملة</label><input id="c-camp" list="camp-list" autocomplete="off" placeholder="مثلاً فرو أكتوبر"></div>
        </div></div>
      <div id="c-over" hidden style="grid-column:1/-1">
        <p class="note bad" id="c-over-msg" style="margin-top:0"></p>
        <label style="display:flex;align-items:center;gap:8px;font-size:var(--fs-2);cursor:pointer;margin-top:6px">
          <input type="checkbox" id="c-force" style="width:auto;margin:0">
          <span>أنا متأكد — سجّلها برضه وخلّي الخزنة بالسالب</span>
        </label>
      </div>
      <div><button class="act" type="button" id="b-cash">حفظ الحركة</button> <button class="act ghost" type="button" id="x-cash" hidden>إلغاء</button></div>
    </form>
    </div>
  </div>
  <!-- الدفتر بالأيام: الأحدث فوق، وكل يوم صافيه والرصيد في آخره -->
  <div id="cash-days"></div>
  <p class="more-wrap"><button class="tbtn" type="button" data-more="cash" hidden></button></p>

  <details class="hm-more" id="cash-table-more">
  <summary>الدفتر كجدول · ومحافظ شركات الشحن</summary>
  <div class="panel" id="wallet-panel" hidden>
    <h3>محافظ شركات الشحن</h3>
    <p class="hint" style="margin-bottom:12px">الفلوس اللي شركة الشحن حصّلتها من العملاء ولسه ما وصلتكش. لما تستلمها سجّلها كـ<strong>سحب من شركة شحن</strong> فوق، فتتنقل للخزنة.</p>
    <div class="tbl-wrap"><table id="t-wallets"></table></div>
  </div>

  <div class="tbl-wrap"><table id="t-cash"></table></div>
  </details>
</section>
